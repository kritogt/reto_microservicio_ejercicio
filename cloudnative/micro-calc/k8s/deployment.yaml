apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-calc
  namespace: calculadora
  labels:
    app: micro-calc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: micro-calc
  template:
    metadata:
      labels:
        app: micro-calc
    spec:
      containers:
      - name: micro-calc
        image: caritogonzales/micro-calc:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: calc-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"